name: Kit / Scenario validate

# Reusable. Consumers pin an immutable ref (release tag or commit SHA):
#   uses: ninjapaw/pawprint/.github/workflows/kit-scenario-validate.yml@<immutable-ref>
#
# Validates every scenario manifest in the calling repository against the
# Pawprint scenario schema and the catalog safety policy: bounded lifetime,
# declared blast radius, justified public ingress, and evidence that is
# observed from the running system rather than assumed from configuration.

on:
  workflow_call:
    inputs:
      scenario-glob:
        description: Glob matching scenario manifests in the calling repository.
        type: string
        default: "scenarios/**/scenario.json"
      pawprint-ref:
        description: Immutable release tag or commit SHA of ninjapaw/pawprint supplying the schema and validator.
        type: string
        required: true
      require-at-least-one:
        description: Fail when the glob matches no scenarios, rather than passing vacuously.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Schema and safety policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4
        with:
          path: consumer

      - name: Check out Pawprint
        uses: actions/checkout@v4
        with:
          repository: ninjapaw/pawprint
          ref: ${{ inputs.pawprint-ref }}
          path: pawprint

      - name: Validate Pawprint reference and tool contract
        env:
          PAWPRINT_REF: ${{ inputs.pawprint-ref }}
        run: |
          case "$PAWPRINT_REF" in
            dev|main|v1|latest)
              echo "::error::pawprint-ref must be an immutable release tag or commit SHA, not '$PAWPRINT_REF'."
              exit 1
              ;;
          esac
          git -C pawprint rev-parse --verify HEAD >/dev/null
          test -s pawprint/.node-version || {
            echo "::error::The referenced Pawprint revision must contain .node-version."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version-file: pawprint/.node-version
          cache: npm
          cache-dependency-path: pawprint/package-lock.json

      - name: Install validator dependencies
        working-directory: pawprint
        run: npm ci

      - name: Validate scenarios
        run: |
          shopt -s nullglob globstar
          cd consumer
          files=(${{ inputs.scenario-glob }})
          cd ..

          if [ ${#files[@]} -eq 0 ]; then
            if [ "${{ inputs.require-at-least-one }}" = "true" ]; then
              echo "::error::No scenario manifests matched '${{ inputs.scenario-glob }}'."
              exit 1
            fi
            echo "::warning::No scenario manifests matched; nothing to validate."
            exit 0
          fi

          prefixed=()
          for file in "${files[@]}"; do
            prefixed+=("consumer/$file")
          done

          node pawprint/scripts/validate-scenario.mjs "${prefixed[@]}"
