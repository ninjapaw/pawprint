name: Kit / Deploy static site

# Reusable. Consumers pin an immutable ref (release tag or commit SHA):
#   uses: ninjapaw/pawprint/.github/workflows/kit-deploy-static-site.yml@<immutable-ref>
#
# Resolves the target environment from the branch, refuses a branch and
# environment that disagree, then builds and publishes to Azure Static Web Apps.
# The branch-to-environment mapping is the deployment safety property here: it is
# what stops a production publish from a feature branch.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy. Leave as auto-detect to infer from the branch.
        type: string
        default: auto-detect
      config-file:
        description: Deployment configuration supplying publicSiteUrl per environment.
        type: string
        default: config/deploy.config.json
      pre-build-commands:
        description: >-
          Newline-separated shell commands run after npm ci and before the build.
          Use this for the repository's own validation, for example npm run check.
        type: string
        default: ""
      build-command:
        type: string
        default: npm run build
      site-base:
        description: Value exported as PUBLIC_SITE_BASE during the build.
        type: string
        default: "/"
      app-location:
        description: Directory containing the built artefact.
        type: string
        default: dist
      run-e2e:
        description: Run browser smoke tests against the build before publishing.
        type: boolean
        default: false
      e2e-command:
        type: string
        default: npm run test:e2e
      create-release:
        description: Cut a CalVer GitHub Release after a successful production deploy.
        type: boolean
        default: true
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN:
        required: true
    outputs:
      environment:
        value: ${{ jobs.resolve-environment.outputs.environment }}
      site-url:
        value: ${{ jobs.resolve-environment.outputs.site-url }}
      app-version:
        value: ${{ jobs.build-and-deploy.outputs.app-version }}

permissions:
  contents: read

jobs:
  resolve-environment:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      site-url: ${{ steps.detect.outputs.site-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect environment from branch or input
        id: detect
        env:
          BRANCH: ${{ github.ref_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          CONFIG_FILE: ${{ inputs.config-file }}
        run: |
          set -euo pipefail

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error title=Missing config::Expected $CONFIG_FILE to define environment defaults."
            exit 1
          fi

          case "$BRANCH" in
            main) detected=prod ;;
            dev) detected=dev ;;
            *) detected="" ;;
          esac

          if [ -n "$INPUT_ENVIRONMENT" ] && [ "$INPUT_ENVIRONMENT" != "auto-detect" ]; then
            environment="$INPUT_ENVIRONMENT"
          elif [ -n "$detected" ]; then
            environment="$detected"
          else
            echo "::error title=Unsupported branch::Cannot auto-detect an environment for '$BRANCH'. Deploy from 'dev' or 'main'."
            exit 1
          fi

          # A dispatch that names an environment the branch does not map to is
          # almost always a mistake, and always the expensive kind.
          if [ -n "$detected" ] && [ "$environment" != "$detected" ]; then
            echo "::error title=Branch and environment mismatch::Branch '$BRANCH' maps to $detected, not $environment."
            exit 1
          fi

          site_url="$(jq -r --arg env "$environment" '.environments[$env].publicSiteUrl // .defaults.publicSiteUrl // empty' "$CONFIG_FILE")"
          if [ -z "$site_url" ]; then
            echo "::error title=Invalid config::publicSiteUrl is missing for environment '$environment'."
            exit 1
          fi

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "site-url=$site_url" >> "$GITHUB_OUTPUT"
          echo "Deploying '$BRANCH' to the $environment environment." >> "$GITHUB_STEP_SUMMARY"

  build-and-deploy:
    name: Build and publish
    needs: resolve-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    outputs:
      app-version: ${{ steps.version.outputs.app-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Pre-build checks
        if: ${{ inputs.pre-build-commands != '' }}
        run: ${{ inputs.pre-build-commands }}

      - name: Set build version
        id: version
        run: |
          app_version="v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"
          echo "PUBLIC_APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "app-version=$app_version" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build
        env:
          PUBLIC_SITE_URL: ${{ vars.AZURE_PUBLIC_SITE_URL || vars.PUBLIC_SITE_URL || needs.resolve-environment.outputs.site-url }}
          PUBLIC_SITE_BASE: ${{ inputs.site-base }}
        run: ${{ inputs.build-command }}

      - name: Install Playwright browsers
        if: ${{ inputs.run-e2e }}
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        if: ${{ inputs.run-e2e }}
        run: ${{ inputs.e2e-command }}

      # Failing here is cheaper than a half-finished publish, so the token is
      # checked before anything is uploaded.
      - name: Verify Static Web Apps deployment token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: ': "${AZURE_STATIC_WEB_APPS_API_TOKEN:?Set this secret after provisioning the Static Web App}"'

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ${{ inputs.app-location }}
          output_location: ""
          skip_app_build: true

  release:
    name: Cut release
    if: >-
      ${{ inputs.create-release
      && needs.resolve-environment.outputs.environment == 'prod'
      && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]')) }}
    needs: [resolve-environment, build-and-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          APP_VERSION: ${{ needs.build-and-deploy.outputs.app-version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${APP_VERSION}" \
            --title "${APP_VERSION}" \
            --generate-notes || true
