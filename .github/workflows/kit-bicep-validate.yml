name: Kit / Bicep validate

# Reusable. Consumers pin an immutable ref (release tag or commit SHA):
#   uses: ninjapaw/pawprint/.github/workflows/kit-bicep-validate.yml@<immutable-ref>
#
# Compiles every Bicep file and, where a compiled ARM template is committed
# alongside it, proves the two are in sync. A committed artifact that is not
# regenerated in the same pull request is not generated, it is a fork.

on:
  workflow_call:
    inputs:
      bicep-glob:
        description: Glob of Bicep files to compile.
        type: string
        default: "infra/**/*.bicep"
      check-committed-arm:
        description: >-
          Fail when a committed <name>.json sibling differs from the freshly
          compiled output of <name>.bicep.
        type: boolean
        default: true
      check-bicepconfig:
        description: >-
          Fail when the consumer's bicepconfig.json differs from the canonical
          ruleset shipped with this kit. A lint gate every repo configures
          differently is not a gate.
        type: boolean
        default: true
      bicepconfig-path:
        description: Path to the consumer's bicepconfig.json, relative to working-directory.
        type: string
        default: bicepconfig.json
      vendored-kit-path:
        description: >-
          Directory holding vendored copies of this kit's files. Bicep has no
          module registry here, so shared modules are copied in and this gate
          proves the copy still matches the source. Paths inside mirror the kit
          repository root. Skipped when the directory does not exist.
        type: string
        default: vendor/pawprint
      fail-on-lint-warning:
        description: >-
          Treat Bicep linter warnings as failures. Stale API versions and unused
          parameters are cheap to fix now and expensive to discover later.
        type: boolean
        default: true
      what-if:
        description: >-
          Run a deployment what-if and post the predicted delta. Requires an
          environment supplying OIDC identity variables.
        type: boolean
        default: false
      environment:
        description: GitHub Environment supplying OIDC identity variables, required when what-if is true.
        type: string
        default: ""
      what-if-template:
        description: Subscription-scope template to evaluate.
        type: string
        default: platform/main.bicep
      what-if-parameters:
        description: Parameter file for the what-if evaluation.
        type: string
        default: platform/main.dev.bicepparam
      working-directory:
        type: string
        default: "."

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Compile and drift-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # The kit's own commit is the source of truth, so both drift checks below
      # compare against exactly the ref the consumer pinned.
      - name: Check out the kit
        if: ${{ inputs.check-bicepconfig || inputs.vendored-kit-path != '' }}
        uses: actions/checkout@v4
        with:
          repository: ninjapaw/pawprint
          ref: ${{ github.job_workflow_sha }}
          path: .pawprint-kit

      - name: Drift-check bicepconfig.json
        if: ${{ inputs.check-bicepconfig }}
        run: |
          set -euo pipefail
          canonical="$GITHUB_WORKSPACE/.pawprint-kit/bicepconfig.json"
          local_config="${{ inputs.bicepconfig-path }}"
          if [ ! -f "$canonical" ]; then
            echo "::warning::Canonical bicepconfig.json unavailable; skipping the ruleset drift check."
            exit 0
          fi
          if [ ! -f "$local_config" ]; then
            echo "::error file=$local_config::$local_config is missing. Copy it from ninjapaw/pawprint so this repo lints against the shared ruleset."
            exit 1
          fi
          if diff <(jq -S . "$canonical") <(jq -S . "$local_config") > /dev/null; then
            echo "in sync: $local_config"
          else
            echo "::error file=$local_config::$local_config drifted from the canonical pawprint ruleset."
            diff <(jq -S . "$canonical") <(jq -S . "$local_config") || true
            exit 1
          fi

      - name: Drift-check vendored kit files
        if: ${{ inputs.vendored-kit-path != '' }}
        run: |
          set -euo pipefail
          vendored="${{ inputs.vendored-kit-path }}"
          kit="$GITHUB_WORKSPACE/.pawprint-kit"
          if [ ! -d "$vendored" ]; then
            echo "No vendored kit directory at '$vendored'; nothing to check."
            exit 0
          fi
          drifted=0
          while IFS= read -r -d '' file; do
            relative="${file#"$vendored"/}"
            source_file="$kit/$relative"
            if [ ! -f "$source_file" ]; then
              echo "::error file=$file::$relative does not exist in the kit. Delete the vendored copy or upstream the file."
              drifted=1
              continue
            fi
            # Compared with line endings normalised: consumers and the kit are
            # separate checkouts and a CRLF difference is not a fork.
            if diff -q <(tr -d '\r' < "$source_file") <(tr -d '\r' < "$file") > /dev/null; then
              echo "in sync: $file"
            else
              echo "::error file=$file::$relative drifted from the kit. Re-vendor it instead of editing the copy."
              diff <(tr -d '\r' < "$source_file") <(tr -d '\r' < "$file") || true
              drifted=1
            fi
          done < <(find "$vendored" -type f -print0)
          exit $drifted

      - name: Install Bicep
        run: az bicep install

      - name: Compile
        run: |
          shopt -s nullglob globstar
          files=(${{ inputs.bicep-glob }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No Bicep files matched '${{ inputs.bicep-glob }}'."
            exit 0
          fi
          failed=0
          for file in "${files[@]}"; do
            echo "compiling $file"
            log="$(mktemp)"
            az bicep build --file "$file" --outfile /dev/null 2> "$log" || failed=1
            # Info lines report which bicepconfig.json was picked up and are not findings.
            if grep -E ': (Warning|Error) ' "$log"; then
              if [ "${{ inputs.fail-on-lint-warning }}" = "true" ]; then
                echo "::error file=$file::Bicep linter reported findings."
                failed=1
              fi
            fi
          done
          exit $failed

      - name: Drift-check committed ARM templates
        if: ${{ inputs.check-committed-arm }}
        run: |
          shopt -s nullglob globstar
          files=(${{ inputs.bicep-glob }})
          drifted=()
          for file in "${files[@]}"; do
            committed="${file%.bicep}.json"
            [ -f "$committed" ] || continue
            fresh="$(mktemp)"
            az bicep build --file "$file" --outfile "$fresh"
            # Compare semantically so key ordering and whitespace do not cause
            # false positives; only real template differences fail the gate.
            if ! diff <(jq -S . "$committed") <(jq -S . "$fresh") > /dev/null; then
              drifted+=("$committed")
              echo "::error file=$committed::$committed is out of sync with $file. Recompile and commit it."
              diff <(jq -S . "$committed") <(jq -S . "$fresh") || true
            else
              echo "in sync: $committed"
            fi
          done
          if [ ${#drifted[@]} -gt 0 ]; then
            echo "${#drifted[@]} committed ARM template(s) drifted from source."
            exit 1
          fi

  what-if:
    name: Predicted deployment delta
    if: ${{ inputs.what-if }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the Azure identity variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is not set. These are GitHub Variables, not Secrets: with OIDC there is no client secret, and masking an identifier only redacts it out of the deployment log."
              exit 1
            fi
          done

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # what-if is the safety net a reviewer actually reads: it shows the change
      # in Azure terms rather than as a template diff.
      - name: What-if
        env:
          PAWPRINT_RUN_ID: whatif-${{ github.run_id }}
          PAWPRINT_RESOURCE_GROUP: ${{ vars.PAWPRINT_RESOURCE_GROUP }}
          PAWPRINT_LOCATION: ${{ vars.PAWPRINT_LOCATION }}
        run: |
          set -euo pipefail
          az deployment sub what-if \
            --location "${PAWPRINT_LOCATION:-centralus}" \
            --template-file "${{ inputs.what-if-template }}" \
            --parameters "${{ inputs.what-if-parameters }}" \
            --result-format FullResourcePayloads \
            | tee what-if.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Predicted deployment delta"
            echo ""
            echo '```'
            head -c 60000 what-if.txt || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
