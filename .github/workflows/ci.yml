name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Schemas, config and guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Validate schemas and sample fixtures
        run: npm run schema:check

      - name: Validate shipped configuration
        run: npm run config:check

      - name: Validate sample scenarios against schema and safety policy
        run: npm run scenario:check

      - name: Assert configuration guardrails reject bad input
        run: npm run test:guardrails

      - name: Assert scenario safety policies reject unsafe manifests
        run: npm run test:policy

      # This resolver is vendored into other repositories, so a regression here
      # breaks them and none of them can catch it.
      - name: Test the shared deployment config resolver
        run: npm run test:deploy-config

      - name: Assert every vendorable file still exists
        run: npm run vendor:check

      - name: Test EASM configuration, approval, transport, and reconciliation safety
        run: npm run test:easm

  portal:
    name: Portal and API validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: api
      - run: npm run portal:test
      - run: npm run api:test
      - run: npm run api:build

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          shopt -s nullglob globstar
          files=(scripts/**/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts to check."
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "checking $file"
            bash -n "$file"
          done

  bicep:
    name: Bicep modules compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Compile every Bicep module
        run: |
          shopt -s nullglob globstar
          files=(modules/**/*.bicep platform/**/*.bicep infra/portal/**/*.bicep)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Bicep modules to compile."
            exit 0
          fi
          az bicep install
          failed=0
          for file in "${files[@]}"; do
            echo "compiling $file"
            log="$(mktemp)"
            output=/dev/null
            if [[ "$file" == platform/org.bicep ]]; then
              output="$RUNNER_TEMP/pawprint-org.json"
            elif [[ "$file" == infra/portal/main.bicep ]]; then
              output="$RUNNER_TEMP/pawprint-portal.json"
            fi
            az bicep build --file "$file" --outfile "$output" 2> "$log" || failed=1
            # This repository publishes the ruleset, so a warning here would ship
            # to every consumer as a warning they cannot fix.
            if grep -E ': (Warning|Error) ' "$log"; then
              echo "::error file=$file::Bicep linter reported findings."
              failed=1
            fi
          done
          if [[ "$failed" != 0 ]]; then exit "$failed"; fi
          node scripts/check-easm-infra.mjs "$RUNNER_TEMP/pawprint-org.json"
          for environment in dev prod; do
            az bicep build-params --file "platform/org.$environment.bicepparam" \
              --outfile "$RUNNER_TEMP/pawprint-org-$environment.parameters.json"
          done
          az bicep build-params --file infra/portal/main.dev.bicepparam \
            --outfile "$RUNNER_TEMP/pawprint-portal.parameters.json"
          node scripts/check-portal-infra.mjs \
            "$RUNNER_TEMP/pawprint-portal.json" "$RUNNER_TEMP/pawprint-portal.parameters.json"
