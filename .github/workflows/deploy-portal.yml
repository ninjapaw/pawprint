name: Deploy Pawprint Portal

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/deploy-portal.yml
      - .github/workflows/kit-deploy-static-site.yml
      - astro.config.mjs
      - config/portal.deploy.json
      - public/staticwebapp.config.json
      - public/portal-public.json
      - package.json
      - package-lock.json
      - public/**
      - src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawprint-portal-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run portal:check

      - name: Read deployment URL
        id: config
        run: |
          site_url="$(jq -r '.environments.dev.publicSiteUrl // empty' config/portal.deploy.json)"
          [[ "$site_url" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[^[:cntrl:]]*)?$ ]]
          printf 'site-url=%s\n' "$site_url" >> "$GITHUB_OUTPUT"

      - name: Set build version
        run: |
          echo "PUBLIC_APP_VERSION=v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "PUBLIC_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build
        env:
          PUBLIC_SITE_URL: ${{ steps.config.outputs.site-url }}
          PUBLIC_SITE_BASE: /
        run: npm run portal:build

      - name: Verify Static Web Apps deployment token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: ': "${AZURE_STATIC_WEB_APPS_API_TOKEN:?Set this environment secret after provisioning the Static Web App}"'

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
