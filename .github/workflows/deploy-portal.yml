name: Deploy Pawprint Portal

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/deploy-portal.yml
      - .github/workflows/kit-deploy-static-site.yml
      - astro.config.mjs
      - config/portal.deploy.json
      - public/staticwebapp.config.json
      - public/portal-public.json
      - package.json
      - package-lock.json
      - public/**
      - src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawprint-portal-dev
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/kit-deploy-static-site.yml
    with:
      environment: dev
      config-file: config/portal.deploy.json
      pre-build-commands: npm run portal:check
      build-command: npm run portal:build
      app-location: dist
      create-release: false
